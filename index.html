<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard — URL Threat Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --surface: #0d1526;
      --card: #111d35;
      --border: #1e2f50;
      --accent-green: #00f5a0;
      --accent-red: #ff3b5c;
      --accent-yellow: #ffc542;
      --accent-blue: #3d8eff;
      --text: #e0eaff;
      --muted: #5a7099;
      --font-mono: 'Space Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(61,142,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,142,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .container {
      position: relative;
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }
    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(61,142,255,0.1);
      border: 1px solid rgba(61,142,255,0.25);
      color: var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: pulse 2s infinite;
    }
    h1 {
      font-family: var(--font-mono);
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 30%, #3d8eff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .search-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s 0.1s ease both;
      position: relative;
    }
    .search-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(61,142,255,0.5), transparent);
    }
    .input-row { display: flex; gap: 12px; }
    .url-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .url-input::placeholder { color: var(--muted); }
    .url-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(61,142,255,0.12);
    }
    .scan-btn {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }
    .scan-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(61,142,255,0.35); }
    .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .examples {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .examples-label { color: var(--muted); font-size: 12px; }
    .example-pill {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .example-pill:hover { color: var(--text); border-color: var(--accent-blue); }
    .api-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--muted);
      margin-top: 12px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .status-dot.online  { background: var(--accent-green); animation: pulse 2s infinite; }
    .status-dot.offline { background: var(--accent-red); }
    .error-msg {
      background: rgba(255,59,92,0.08);
      border: 1px solid rgba(255,59,92,0.25);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--accent-red);
      font-size: 13px;
      font-family: var(--font-mono);
      display: none;
      margin-bottom: 16px;
    }
    .error-msg.visible { display: block; }
    .loading { display: none; text-align: center; padding: 40px; color: var(--muted); }
    .loading.visible { display: block; }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: none;
      margin-bottom: 24px;
      animation: fadeUp 0.4s ease both;
    }
    .result-card.visible { display: block; }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .verdict { display: flex; align-items: center; gap: 14px; }
    .verdict-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .verdict-icon.safe   { background: rgba(0,245,160,0.1); border: 1px solid rgba(0,245,160,0.25); }
    .verdict-icon.danger { background: rgba(255,59,92,0.1); border: 1px solid rgba(255,59,92,0.25); }
    .verdict-icon.warn   { background: rgba(255,197,66,0.1); border: 1px solid rgba(255,197,66,0.25); }
    .verdict-title { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
    .verdict-title.safe   { color: var(--accent-green); }
    .verdict-title.danger { color: var(--accent-red); }
    .verdict-title.warn   { color: var(--accent-yellow); }
    .verdict-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .risk-badge {
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .risk-HIGH   { background: rgba(255,59,92,0.15); color: var(--accent-red); border: 1px solid rgba(255,59,92,0.3); }
    .risk-MEDIUM { background: rgba(255,197,66,0.15); color: var(--accent-yellow); border: 1px solid rgba(255,197,66,0.3); }
    .risk-LOW    { background: rgba(0,245,160,0.1); color: var(--accent-green); border: 1px solid rgba(0,245,160,0.25); }
    .conf-label {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--muted); margin-bottom: 8px;
    }
    .conf-label span:last-child { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--text); }
    .conf-bar-bg { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
    .conf-bar-fill { height: 100%; border-radius: 999px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); width: 0%; }
    .conf-bar-fill.phishing { background: linear-gradient(90deg, #ff3b5c, #ff7891); }
    .conf-bar-fill.legit    { background: linear-gradient(90deg, #00f5a0, #00d4ff); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--text); }
    .features-section { margin-top: 8px; }
    .features-toggle {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; color: var(--muted); font-size: 13px;
      margin-bottom: 12px; user-select: none;
    }
    .features-toggle:hover { color: var(--text); }
    .arrow { font-size: 10px; transition: transform 0.2s; }
    .features-toggle.open .arrow { transform: rotate(90deg); }
    .features-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .features-grid.open { display: grid; }
    .feat-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; }
    .feat-name { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
    .feat-val  { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text); }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(20px);  } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes pulse    { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @media (max-width: 580px) { .input-row { flex-direction: column; } .result-header { flex-direction: column; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge"><div class="badge-dot"></div>AI-POWERED · ML MODEL · REAL-TIME</div>
    <h1>PhishGuard</h1>
    <p class="subtitle">Paste any URL. Our ML model analyzes 22 features to detect phishing threats instantly.</p>
  </header>

  <div class="search-card">
    <div class="input-row">
      <input class="url-input" id="urlInput" type="text" placeholder="https://example.com or paste a suspicious link..." autocomplete="off" spellcheck="false"/>
      <button class="scan-btn" id="scanBtn" onclick="scanURL()">SCAN →</button>
    </div>
    <div class="examples">
      <span class="examples-label">Try:</span>
      <span class="example-pill" onclick="setExample('https://google.com')">google.com</span>
      <span class="example-pill" onclick="setExample('http://secure-paypal-login.xyz/verify?id=38492')">fake paypal</span>
      <span class="example-pill" onclick="setExample('http://192.168.1.100/account/login')">IP login</span>
      <span class="example-pill" onclick="setExample('https://github.com')">github.com</span>
    </div>
    <div><span class="api-status"><span class="status-dot" id="statusDot"></span><span id="statusText">Checking API...</span></span></div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing URL features...</p></div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <div class="verdict">
        <div class="verdict-icon" id="verdictIcon"></div>
        <div>
          <div class="verdict-title" id="verdictTitle"></div>
          <div class="verdict-sub"  id="verdictSub"></div>
        </div>
      </div>
      <div class="risk-badge" id="riskBadge"></div>
    </div>
    <div class="conf-label"><span>Model Confidence</span><span id="confPercent">0%</span></div>
    <div class="conf-bar-bg"><div class="conf-bar-fill" id="confBar"></div></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="features-section">
      <div class="features-toggle" id="featToggle" onclick="toggleFeatures()">
        <span class="arrow">▶</span><span>View Extracted Features</span>
      </div>
      <div class="features-grid" id="featuresGrid"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8080";

async function checkAPI() {
  try {
    const res = await fetch(`${API_BASE}/`, { signal: AbortSignal.timeout(3000) });
    if (res.ok) {
      document.getElementById("statusDot").className = "status-dot online";
      document.getElementById("statusText").textContent = "API Connected";
    } else throw new Error();
  } catch {
    document.getElementById("statusDot").className = "status-dot offline";
    document.getElementById("statusText").textContent = "API Offline — run step4_api.py";
  }
}

function setExample(url) {
  document.getElementById("urlInput").value = url;
}

function toggleFeatures() {
  document.getElementById("featToggle").classList.toggle("open");
  document.getElementById("featuresGrid").classList.toggle("open");
}

async function scanURL() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) { showError("Please enter a URL."); return; }

  hideError();
  document.getElementById("loading").classList.add("visible");
  document.getElementById("resultCard").classList.remove("visible");
  document.getElementById("scanBtn").disabled = true;

  try {
    const res = await fetch(`${API_BASE}/predict`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    renderResult(data);
  } catch(e) {
    showError("Cannot reach API. Make sure step4_api.py is running.");
  } finally {
    document.getElementById("loading").classList.remove("visible");
    document.getElementById("scanBtn").disabled = false;
  }
}

function renderResult(data) {
  const isPhish = data.is_phishing;
  const conf    = Math.round(data.confidence * 100);
  const risk    = data.risk_level;

  const icon = document.getElementById("verdictIcon");
  icon.className = "verdict-icon " + (isPhish ? (risk === "HIGH" ? "danger" : "warn") : "safe");
  icon.textContent = isPhish ? (risk === "HIGH" ? "🚨" : "⚠️") : "✅";

  const title = document.getElementById("verdictTitle");
  title.textContent = isPhish ? "PHISHING DETECTED" : "SAFE URL";
  title.className = "verdict-title " + (isPhish ? (risk === "HIGH" ? "danger" : "warn") : "safe");

  document.getElementById("verdictSub").textContent = isPhish
    ? "This URL shows signs of a phishing attack."
    : "No phishing signals detected.";

  const rb = document.getElementById("riskBadge");
  rb.textContent = risk + " RISK";
  rb.className = "risk-badge risk-" + risk;

  setTimeout(() => {
    document.getElementById("confBar").style.width = conf + "%";
    document.getElementById("confBar").className = "conf-bar-fill " + (isPhish ? "phishing" : "legit");
  }, 50);
  document.getElementById("confPercent").textContent = conf + "%";

  document.getElementById("statsGrid").innerHTML = [
    { label: "RESULT",     value: data.result.toUpperCase() },
    { label: "PHISH PROB", value: (data.phishing_probability * 100).toFixed(1) + "%" },
    { label: "LEGIT PROB", value: (data.legit_probability * 100).toFixed(1) + "%" },
    { label: "RISK LEVEL", value: risk }
  ].map(s => `<div class="stat-box"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join("");

  const feats = data.features || {};
  document.getElementById("featuresGrid").innerHTML = Object.entries(feats)
    .map(([k,v]) => `<div class="feat-item"><span class="feat-name">${k}</span><span class="feat-val">${typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(4)) : v}</span></div>`)
    .join("");

  document.getElementById("featToggle").classList.remove("open");
  document.getElementById("featuresGrid").classList.remove("open");
  document.getElementById("resultCard").classList.add("visible");
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = "⚠ " + msg;
  el.classList.add("visible");
}

function hideError() {
  document.getElementById("errorMsg").classList.remove("visible");
}

document.getElementById("urlInput").addEventListener("keydown", e => {
  if (e.key === "Enter") scanURL();
});

checkAPI();
setInterval(checkAPI, 10000);
</script>
</body>
</html>
